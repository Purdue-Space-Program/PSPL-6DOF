[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pspl-6dof"
version = "0.1.0"
description = "Python dependencies for the PSP Liquids six-degree-of-freedom simulator"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.5",
    "openmeteo-requests==1.7.5",
    "pandas==3.0.5",
    "requests-cache==1.3.3",
    "retry-requests==2.0.0",
]

[tool.setuptools]
packages = []
